services:
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    network_mode: service:runtime
    depends_on:
      runtime:
        condition: service_healthy
    command: [tunnel, --no-autoupdate, --protocol, http2, run, --token-file, /run/secrets/cloudflare_tunnel_token]
    secrets: [cloudflare_tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
secrets:
  cloudflare_tunnel_token:
    file: ./cloudflare-tunnel.token
