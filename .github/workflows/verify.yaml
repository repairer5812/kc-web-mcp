name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: bash -n scripts/entrypoint.sh scripts/install.sh
      - run: python -m py_compile scripts/configure.py scripts/smoke_test.py scripts/customize.py
      - run: python scripts/smoke_test.py node_modules/@starlove7/spacedock/npm/dist/linux-amd64/spacedock
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 256m --cpus 0.5 --pids-limit 256 --tmpfs /tmp:uid=1000,gid=1000,mode=1777,size=256m --entrypoint python3 webjjonku-runtime /opt/kc-mcp/scripts/smoke_test.py /usr/local/bin/spacedock --output /tmp/smoke.json
